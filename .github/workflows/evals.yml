name: evals

on:
  push:
  pull_request:

jobs:
  offline-checks:
    name: offline checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Run checks that do not call a model
        run: uv run pytest tests/eval tests/test_cli.py tests/test_db.py tests/test_hw_holes.py tests/test_harbor_adapter.py tests/test_harbor_trial_results.py tests/test_replay_harness.py -q

  complete-evaluations:
    name: Harbor evaluations
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      CARTWHEEL_MODEL: ${{ vars.CARTWHEEL_MODEL }}
      PYTHONPATH: ${{ github.workspace }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v5
      - run: uv sync

      - name: Install Harbor 0.23.0
        run: |
          uv tool install harbor==0.23.0
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"

      # Fails if any case is still missing its kind / baseline_pass_rate.
      - name: Generate the classified Harbor tasks
        run: uv run python scripts/export_harbor_tasks.py

      # The agent reads the provider keys from this job's env (set above from
      # repository secrets); each trial runs in a fresh Docker container.
      - name: Run every case five times
        run: |
          harbor run \
            -p .harbor/tasks \
            -a harbor_adapter.agent:CartwheelAgent \
            -m "$CARTWHEEL_MODEL" \
            -e docker \
            --n-attempts 5 \
            --job-name hw6-evals \
            --jobs-dir .harbor/jobs \
            --yes

      # Exits 1 when a regression case fails any run; capability never blocks.
      - name: Summarize and apply the CI gate
        if: always()
        run: |
          uv run python scripts/summarize_harbor_job.py \
            .harbor/jobs/hw6-evals \
            --cases eval_cases/cases.jsonl \
            --expected-attempts 5

      - name: Upload the Harbor job files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hw6-evals
          path: .harbor/jobs/hw6-evals
          if-no-files-found: warn
